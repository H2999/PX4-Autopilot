module_name: Commander
parameters:
    - group: Commander
      definitions:
        TRTL_PWR:
            description:
                short: Maximum Turtle recovery throttle
                long: Normalised throttle, not measured thrust. Output is hard limited to 0.6, including old stored values above that limit. Start with propellers removed.
            type: float
            min: 0.05
            max: 0.6
            decimal: 2
            default: 0.4
        TRTL_RATE:
            description:
                short: Turtle angular rate target
                long: Recovery throttle reduces as measured body angular speed approaches this value. Upright levelling caps this target at 1 rad/s. Hard cutoff remains 8 rad/s.
            type: float
            unit: rad/s
            min: 0.5
            max: 6.0
            decimal: 1
            default: 4.0
        TRTL_PULSE:
            description:
                short: Maximum duration of each inverted Turtle thrust pulse
            type: float
            unit: s
            min: 0.1
            max: 6.0
            decimal: 2
            default: 1.5
        TRTL_LPULSE:
            description:
                short: Maximum duration of each upright levelling pulse
                long: Independent of inverted recovery. Attitude, rate, cancellation and safety limits can stop thrust earlier.
            type: float
            unit: s
            min: 0.1
            max: 6.0
            decimal: 2
            default: 5.0
        TRTL_TOUT:
            description:
                short: Maximum total automatic Turtle recovery attempt
                long: Includes stop, direction commands, thrust and settling. Exit and re-enter to retry.
            type: float
            unit: s
            min: 2
            max: 20
            decimal: 1
            default: 10
        TRTL_EN:
            description:
                short: Enable experimental automatic Turtle recovery mode
                long: |
                    Requires Bluejay-compatible relative DShot direction commands, coplanar Quad-X,
                    valid CA rotor geometry and all four motors assigned to DShot outputs.
                    Enter Turtle only while disarmed, on the ground, throttle low and sticks centred.
                    Inverted recovery reverses the higher pair. Upright levelling starts at 3 degrees
                    and uses the lower pair in its saved normal direction, stopping at 1 degree.
                    With this enabled, arming requires a live DShot recovery readiness heartbeat.
            type: boolean
            default: 0
        COM_MODE${i}_HASH:
            description:
                short: External mode identifier ${i}
                long: |
                    This parameter is automatically set to identify external modes. It ensures that modes
                    get assigned to the same index independent from their startup order,
                    which is required when mapping an external mode to an RC switch.
            type: int32
            num_instances: 8 # Max 8 modes (NAVIGATION_STATE_EXTERNAL8)
            default: 0
            volatile: true
            category: System

        COM_FLTMODE${i}:
            description:
                short: Mode slot ${i}
                long: |
                    If the main switch channel is in this range the
                    selected flight mode will be applied.
            type: enum
            values:
                -1: Unassigned
                0: Manual
                1: Altitude
                2: Position
                9: Position Slow
                3: Mission
                4: Hold
                10: Takeoff
                11: Land
                5: Return
                6: Acro
                7: Offboard
                8: Stabilized
                12: Follow Me
                13: Precision Land
                16: Altitude Cruise
                17: Turtle
                100: External Mode 1
                101: External Mode 2
                102: External Mode 3
                103: External Mode 4
                104: External Mode 5
                105: External Mode 6
                106: External Mode 7
                107: External Mode 8
            instance_start: 1
            num_instances: 6
            default: -1
